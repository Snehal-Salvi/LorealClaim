# Runs PostgreSQL locally for development.
# Start:  docker compose up -d
# Stop:   docker compose down        (data is kept in the "pgdata" volume)
services:
  db:
    image: postgres:17
    container_name: claims-db
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
